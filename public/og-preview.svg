<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B132B" />
      <stop offset="60%" stopColor="#080E1A" />
      <stop offset="100%" stopColor="#050811" />
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="orb-blue" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stopColor="#2563EB" stop-opacity="0.35" />
      <stop offset="100%" stopColor="#2563EB" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-emerald" cx="85%" cy="75%" r="40%">
      <stop offset="0%" stopColor="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stopColor="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1.5" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- Logo Gradient -->
    <linearGradient id="logo-bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="chevron-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#00D8FF" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#orb-blue)" />
  <rect width="1200" height="630" fill="url(#orb-emerald)" />

  <!-- Outer Card Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Header / Brand -->
  <g transform="translate(80, 80)">
    <!-- Logo Squircle -->
    <rect width="64" height="64" rx="18" fill="url(#logo-bg)" />
    <rect x="1" y="1" width="62" height="62" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2" />
    <!-- Monogram D -->
    <rect x="16" y="16" width="6" height="32" rx="3" fill="#FFFFFF" />
    <path d="M22 16 H34 C44 16 50 23 50 32 C50 41 44 48 34 48 H22" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cyan Chevron & Live Dot -->
    <path d="M26 24 L34 32 L26 40" fill="none" stroke="url(#chevron-cyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="32" r="3" fill="#10B981" />

    <!-- Brand Text -->
    <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      DIDEV<tspan fill="#38BDF8">.STUDIO</tspan>
    </text>
    <text x="84" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">
      SOFTWARE HOUSE &amp; MOBILE DEV
    </text>

    <!-- Top Right Verified Pill -->
    <g transform="translate(760, 8)">
      <rect width="220" height="40" rx="20" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="20" r="5" fill="#10B981" />
      <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">
        Garansi Resmi 1 Tahun
      </text>
    </g>
  </g>

  <!-- Center Punchy Headline -->
  <g transform="translate(80, 230)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Jasa Pembuatan Website &amp;
    </text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="#38BDF8" letter-spacing="-1">
      Aplikasi Android APK Kustom
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
      Aplikasi Kasir POS Bluetooth, Presensi GPS Geofencing &amp; Portal Usaha Terpadu.
    </text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">
      Layanan Fully Managed: Cloud Server VPS Berkecepatan Tinggi, Backup &amp; Maintenance Rutin.
    </text>
  </g>

  <!-- Bottom Value Pillars (4 Badges) -->
  <g transform="translate(80, 480)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect width="235" height="54" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="27" r="10" fill="#2563EB" fill-opacity="0.2" />
      <path d="M24 27 L27 30 L33 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">100% Hak Milik</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Full Source Code</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(255, 0)">
      <rect width="235" height="54" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="27" r="10" fill="#10B981" fill-opacity="0.2" />
      <path d="M24 27 L27 30 L33 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Cloud Server VPS</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Terkelola &amp; Siap Pakai</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(510, 0)">
      <rect width="235" height="54" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="27" r="10" fill="#F59E0B" fill-opacity="0.2" />
      <path d="M24 27 L27 30 L33 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
      <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Rating 4.9 / 5.0</text>
      <text x="46" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">48+ Pemilik Usaha</text>
    </g>

    <!-- Pillar 4 (CTA Contact) -->
    <g transform="translate(765, 0)">
      <rect width="275" height="54" rx="14" fill="#10B981" />
      <text x="32" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">
        Konsultasi via WhatsApp
      </text>
      <text x="238" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">
        &#8594;
      </text>
    </g>
  </g>
</svg>
